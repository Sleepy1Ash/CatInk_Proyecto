<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recomendaciones diarias</title>
    <style>
      @media only screen and (max-width:600px){
        .stack-column,
        .stack-column td{
          display:block !important;
          width:100% !important;
          max-width:100% !important;
        }

        .stack-img{
          width:100% !important;
          max-width: 90% !important;
          height:auto !important;
        }

        .card-padding{
          padding:12px !important;
        }

      }
    </style>  
  </head>
  <body style="background-color:#EF3363; margin:0; padding:0;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding:20px;">
      <tr>
        <td align="center">
          <!-- CONTENEDOR -->
          <table width="600" cellpadding="0" cellspacing="0" border="0" style="background:#EF3363; border-radius:15px; overflow:hidden;">
            <!-- BANNER (YA NO SE CORTA) -->
            <tr>
              <td style="line-height:0; font-size:0;">
                <img 
                  src="cid:banner"
                  width="600"
                  style="width:100%; max-width:600px; height:auto; display:block; border:0;"
                >
              </td>
            </tr>
            <!-- TEXTO -->
            <tr>
              <td>
                <h1 align="center" style="font-family:Arial; color:#ffffff; margin:0;">
                  Recomendaciones diarias
                </h1>
                <hr style="border:1px solid #ffffff; width:80%;">
                <h2 style="font-family:Arial; color:#ffffff;">
                  Ultimas noticias
                </h2>
                {{noticias}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
